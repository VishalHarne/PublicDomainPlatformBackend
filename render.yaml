services:
  - type: web
    name: omraje-email-backend
    runtime: docker
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_RECIPIENT
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://omraje.in,https://vishalharne.github.io
      - key: TURNSTILE_SECRET_KEY
        sync: false
