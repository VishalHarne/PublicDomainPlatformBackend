services:
  - type: web
    name: public-domain-email-service
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_RECIPIENT
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
