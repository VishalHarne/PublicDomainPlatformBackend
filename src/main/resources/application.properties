spring.config.import=optional:file:.env[.properties]

server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8081}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}
app.database-submissions.allowed-origins=${DATABASE_CORS_ALLOWED_ORIGINS:}
app.database-submissions.jdbc-url=${SUBMISSIONS_DATABASE_URL:}
app.database-submissions.db-user=${SUBMISSIONS_DATABASE_USER:}
app.database-submissions.db-password=${SUBMISSIONS_DATABASE_PASSWORD:}
app.database-submissions.gcs-bucket=${SUBMISSIONS_GCS_BUCKET:}
app.database-submissions.grievance-consent-versions=${GRIEVANCE_CONSENT_VERSIONS:}
app.database-submissions.application-consent-versions=${APPLICATION_CONSENT_VERSIONS:}
app.database-submissions.retention-enabled=${APPLICATION_RETENTION_ENABLED:false}
app.database-submissions.retention-db-user=${APPLICATION_RETENTION_DB_USER:}
app.database-submissions.retention-db-password=${APPLICATION_RETENTION_DB_PASSWORD:}

app.mail.from=${MAIL_FROM}
app.mail.recipient=${MAIL_RECIPIENT}
app.mail.imap-host=${IMAP_HOST:}
app.mail.imap-port=${IMAP_PORT:993}
app.mail.imap-username=${IMAP_USERNAME:}
app.mail.imap-password=${IMAP_PASSWORD:}
app.mail.imap-folder=${IMAP_FOLDER:INBOX}
