spring.config.import=optional:file:.env[.properties]

server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

app.mail.from=${MAIL_FROM}
app.mail.recipient=${MAIL_RECIPIENT}
app.mail.imap-host=${IMAP_HOST}
app.mail.imap-port=${IMAP_PORT:993}
app.mail.imap-username=${IMAP_USERNAME}
app.mail.imap-password=${IMAP_PASSWORD}
app.mail.imap-folder=${IMAP_FOLDER:INBOX}
